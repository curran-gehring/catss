[project]
name = "catss"
version = "0.1.0"
description = "Queryable CATSS database: parallel MT/LXX + LXX morphology, BETA decoded to Unicode"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# NT Latin pack: the verse aligner (nt_versemap_audit) needs numpy; the
# lemmatize/align steps also need spaCy + la_core_web_lg and eflomal (mac-mini).
nt = ["numpy>=1.24"]

[project.scripts]
catss = "catss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["catss*"]

[tool.setuptools.package-data]
catss = ["data/*.tsv"]
